bio: |
  Hi! My name is Maziar, though you can call me Maaz. I'm an NLP and computational linguistics researcher. I finished my Master's in Language Technologies and Digital Humanities at the [University of Turin](https://en.unito.it/) in July 2026.
  <br><br>
  My research over the past two years has centered on multilingual and cross-cultural NLP, and on harmful online content, specifically how it spreads and how it is perceived differently across cultures and communities.
  <br><br>
  This interest comes from my own background. I grew up bilingual in Persian and Qashqai Turkish (a Turkic language of the Oghuz branch), and then I studied English language translation for my bachelor's, with a focus on linguistics and translation studies. That's where my love for meaning, cultures, and languages started. We didn't have NLP courses in Iran that I could join with that background (and we still don't), so I applied abroad and came to Italy to study NLP. It was a big move, and one I'm glad I made.
  <br><br>
  [My master's thesis](https://maziarkiani.github.io/publications/thesis-2026/), supervised by Prof. [Viviana Patti](https://www.cs.unito.it/do/docenti.pl/Show?_id=vpatti#tab-profilo) and Dr. [Marco Antonio Stranisci](https://marcostranisci.github.io/), builds on a community-developed dataset on information disorder, [InDor](https://lrec.elra.info/lrec2026-main-515). LLMs can explain why a news article is misleading in fluent language and still miss what a native speaker would point out. So I built a framework that retrieves similar explanations written by native speakers and gives them to the model as examples. I tested it on Persian and Italian, with automatic metrics, a qualitative analysis, and a human evaluation study.
  <br><br>
  Beyond academia, I spent over 3 years in SEO, web content, and digital marketing.
  <br><br>
  **In general, my research interests are:** Multilingual & Cross-Cultural NLP, Computational Social Science (CSS), Explainable AI, Fairness, In-Context Learning, Human-in-the-Loop AI, and Information Disorder.
